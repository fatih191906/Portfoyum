<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borsa Portföy ve İşlem Paneli</title>
    <!-- Bootstrap CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hidden-engine { display: none; } /* Gizli veri motoru alanı */
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .detay-satir { background-color: #f8f9fa !important; font-size: 0.85rem; }
        .btn-plus-minus { background: none; border: none; color: #198754; font-weight: bold; font-size: 1.1rem; padding: 0 6px; cursor: pointer; transition: transform 0.2s; }
        .btn-plus-minus:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h3 fw-bold text-primary">📊 Akıllı Portföy Yönetimi</h1>
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleEngine()">⚙️ Gizli Veri Motorunu Göster/Gizle</button>
        </header>

        <!-- ========================================== -->
        <!-- 1. GİZLİ VERİ MOTORU (Excel Mantığı Arka Plan) -->
        <!-- ========================================== -->
        <div id="engineSection" class="card p-3 mb-4 hidden-engine bg-dark text-white">
            <h5 class="text-warning">🔒 Gizli Veri Motoru (Canlı Fiyat Tablosu)</h5>
            <p class="small text-muted">Bu kısım arkada Excel gibi çalışır ve ön yüzü besler.</p>
            <table class="table table-dark table-striped table-sm" id="gizliTablo">
                <thead>
                    <tr>
                        <th>Hisse Kodu</th>
                        <th>Canlı Fiyat (TL)</th>
                        <th>Son Güncelleme</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dinamik olarak doldurulacak -->
                </tbody>
            </table>
        </div>

        <!-- ========================================== -->
        <!-- 2. ÖN YÜZ / PROGRAM KISMI (İşlem Paneli)   -->
        <!-- ========================================== -->
        <div class="row">
            <!-- İşlem Ekleme Formu -->
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <h5 class="mb-3">İşlem / Alım Ekle</h5>
                    <div class="mb-3">
                        <label class="form-label">Hisse Kodu</label>
                        <input type="text" id="hisseKodu" class="form-control" placeholder="Örn: SASA, EREGL">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adet</label>
                        <input type="number" id="hisseAdet" class="form-control" value="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Birim Maliyet (TL)</label>
                        <input type="number" id="hisseMaliyet" class="form-control" step="0.01" value="10.00">
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="portfoyeEkle()">Alım Ekle</button>
                </div>
            </div>

            <!-- Portföy Özeti ve Listesi -->
            <div class="col-md-8">
                <div class="card p-4">
                    <h5 class="mb-3">Portföy Durumunuz</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="portfoyTablosu">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 30px;"></th>
                                    <th>Hisse</th>
                                    <th>Toplam Adet</th>
                                    <th>Ort. Maliyet</th>
                                    <th>Güncel Fiyat</th>
                                    <th>Toplam Değer</th>
                                    <th>Kâr / Zarar</th>
                                    <th>İşlem</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Kullanıcı verileri buraya gelecek -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let veriMotoru = {
            "SASA": 42.50,
            "EREGL": 51.20,
            "THYAO": 298.00,
            "GARAN": 95.40
        };
        
        try {
            let savedEngine = localStorage.getItem('user_veri_motoru');
            if (savedEngine) veriMotoru = JSON.parse(savedEngine);
        } catch(e) {}

        let portfoy = [];
        try {
            let savedPortfoy = localStorage.getItem('user_portfoy');
            if (savedPortfoy) {
                let parsed = JSON.parse(savedPortfoy);
                if (Array.isArray(parsed)) {
                    portfoy = parsed.map(item => {
                        if (!item.islemGecmisi) {
                            return {
                                kod: item.kod || "BILINMIYOR",
                                islemGecmisi: [{ adet: item.adet || 0, maliyet: item.maliyet || item.ortMaliyet || 0, tarih: "Geçmiş Alım" }],
                                toplamAdet: item.adet || 0,
                                ortMaliyet: item.maliyet || item.ortMaliyet || 0
                            };
                        }
                        return item;
                    });
                }
            }
        } catch(e) {
            portfoy = [];
        }

        function toggleEngine() {
            let engine = document.getElementById('engineSection');
            if (engine.style.display === "none" || engine.style.display === "") {
                engine.style.display = "block";
                gizliTabloyuGuncelle();
            } else {
                engine.style.display = "none";
            }
        }

        function gizliTabloyuGuncelle() {
            let tbody = document.querySelector("#gizliTablo tbody");
            if(!tbody) return;
            tbody.innerHTML = "";
            for (let [hisse, fiyat] of Object.entries(veriMotoru)) {
                tbody.innerHTML += `<tr><td><b>${hisse}</b></td><td>${fiyat.toFixed(2)} TL</td><td>Canlı</td></tr>`;
            }
        }

        function portfoyeEkle() {
            let kodInput = document.getElementById('hisseKodu');
            let adetInput = document.getElementById('hisseAdet');
            let maliyetInput = document.getElementById('hisseMaliyet');

            if (!kodInput || !adetInput || !maliyetInput) return;

            let kod = kodInput.value.toUpperCase().trim();
            let adet = parseFloat(adetInput.value);
            let maliyet = parseFloat(maliyetInput.value);

            if (!kod || isNaN(adet) || isNaN(maliyet) || adet <= 0 || maliyet <= 0) {
                alert("Lütfen geçerli bir hisse kodu, adet ve maliyet girin!");
                return;
            }

            if (!veriMotoru[kod]) {
                veriMotoru[kod] = maliyet * 1.05; 
                try { localStorage.setItem('user_veri_motoru', JSON.stringify(veriMotoru)); } catch(e) {}
            }

            let mevcutHisse = portfoy.find(item => item.kod === kod);
            let yeniIslem = { adet: adet, maliyet: maliyet, tarih: new Date().toLocaleDateString() };

            if (mevcutHisse) {
                if(!mevcutHisse.islemGecmisi) mevcutHisse.islemGecmisi = [];
                mevcutHisse.islemGecmisi.push(yeniIslem);
                hesaplaOrtalama(mevcutHisse);
            } else {
                portfoy.push({
                    kod: kod,
                    islemGecmisi: [yeniIslem],
                    toplamAdet: adet,
                    ortMaliyet: maliyet
                });
            }

            kaydetVeGuncelle();
            kodInput.value = "";
            adetInput.value = "100";
        }

        function hesaplaOrtalama(hisseObj) {
            let toplamMaliyetTutar = 0;
            let toplamAdet = 0;
            hisseObj.islemGecmisi.forEach(islem => {
                toplamMaliyetTutar += (islem.adet * islem.maliyet);
                toplamAdet += islem.adet;
            });
            hisseObj.toplamAdet = toplamAdet;
            hisseObj.ortMaliyet = toplamAdet > 0 ? (toplamMaliyetTutar / toplamAdet) : 0;
        }

        function kaydetVeGuncelle() {
            try { localStorage.setItem('user_portfoy', JSON.stringify(portfoy)); } catch(e) {}
            portfoyuCiz();
            gizliTabloyuGuncelle();
        }

        function portfoyuCiz() {
            let tbody = document.querySelector("#portfoyTablosu tbody");
            if(!tbody) return;
            tbody.innerHTML = "";

            if (!portfoy || portfoy.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">Henüz portföyünüze eklenmiş bir hisse yok.</td></tr>`;
                return;
            }

            portfoy.forEach((item, index) => {
                let guncelFiyat = veriMotoru[item.kod] !== undefined ? veriMotoru[item.kod] : item.ortMaliyet;
                let toplamDeger = item.toplamAdet * guncelFiyat;
                let toplamMaliyetTutar = item.toplamAdet * item.ortMaliyet;
                let karZarar = toplamDeger - toplamMaliyetTutar;
                let renkClass = karZarar >= 0 ? "text-success" : "text-danger";

                // Eğer birden fazla alım yapıldıysa yeşil artı göster, tek alımsa boş bırak
                let plusButton = "";
                if (item.islemGecmisi && item.islemGecmisi.length > 1) {
                    plusButton = `<button type="button" class="btn-plus-minus" onclick="detayAcKapat(${index})" id="btn-detay-${index}">+</button>`;
                }

                // Ana Satır
                tbody.innerHTML += `
                    <tr>
                        <td class="text-center">${plusButton}</td>
                        <td><b>${item.kod}</b></td>
                        <td>${item.toplamAdet}</td>
                        <td>${item.ortMaliyet.toFixed(2)} TL</td>
                        <td>${guncelFiyat.toFixed(2)} TL</td>
                        <td>${toplamDeger.toFixed(2)} TL</td>
                        <td class="${renkClass} fw-bold">${karZarar.toFixed(2)} TL</td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="hisseSil(${index})">Sil</button></td>
                    </tr>
                `;

                // Eğer birden fazla alım varsa açılacak alt detay satırı
                if (item.islemGecmisi && item.islemGecmisi.length > 1) {
                    let subRowsHtml = "";
                    item.islemGecmisi.forEach((islem, i) => {
                        let subDeger = islem.adet * guncelFiyat;
                        let subMaliyetTutar = islem.adet * islem.maliyet;
                        let subKarZarar = subDeger - subMaliyetTutar;
                        let subRenk = subKarZarar >= 0 ? "text-success" : "text-danger";

                        subRowsHtml += `
                            <tr class="text-muted">
                                <td class="ps-4">↳ ${islem.tarih || 'İşlem'}</td>
                                <td><b>${islem.adet} Adet</b></td>
                                <td>Maliyet: ${islem.maliyet.toFixed(2)} TL</td>
                                <td>Fiyat: ${guncelFiyat.toFixed(2)} TL</td>
                                <td>Değer: ${subDeger.toFixed(2)} TL</td>
                                <td colspan="2" class="${subRenk} fw-bold">K/Z: ${subKarZarar.toFixed(2)} TL</td>
                                <td><button type="button" class="btn btn-link text-danger p-0 text-decoration-none fw-bold" onclick="islemSil(${index}, ${i})" title="Bu alımı sil">✖</button></td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML += `
                        <tr id="detay-row-${index}" style="display: none;" class="detay-satir">
                            <td colspan="8" class="p-2">
                                <div class="ms-3 text-secondary small fw-bold mb-1">🔍 ${item.kod} - Alım Geçmişi Detayları:</div>
                                <table class="table table-sm mb-0 bg-transparent">
                                    <tbody>${subRowsHtml}</tbody>
                                </table>
                            </td>
                        </tr>
                    `;
                }
            });
        }

        function detayAcKapat(index) {
            let row = document.getElementById(`detay-row-${index}`);
            let btn = document.getElementById(`btn-detay-${index}`);
            if(!row || !btn) return;
            if (row.style.display === "none") {
                row.style.display = "table-row";
                btn.innerText = "-";
            } else {
                row.style.display = "none";
                btn.innerText = "+";
            }
        }

        function islemSil(hisseIndex, islemIndex) {
            if(portfoy[hisseIndex] && portfoy[hisseIndex].islemGecmisi) {
                portfoy[hisseIndex].islemGecmisi.splice(islemIndex, 1);
                if (portfoy[hisseIndex].islemGecmisi.length === 0) {
                    portfoy.splice(hisseIndex, 1);
                } else {
                    hesaplaOrtalama(portfoy[hisseIndex]);
                }
                kaydetVeGuncelle();
            }
        }

        function hisseSil(index) {
            portfoy.splice(index, 1);
            kaydetVeGuncelle();
        }

        window.onload = function() {
            portfoyuCiz();
            gizliTabloyuGuncelle();
        };
    </script>
</body>
</html>
