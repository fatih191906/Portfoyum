<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portföyüm v39</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --bg-color: #0b0f19;
    --card-bg: #151c2c;
    --card-border: #232d42;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --accent-primary: #38bdf8;
    --accent-hover: #0284c7;
    --green-bg: rgba(34,197,94,.1);
    --green-text: #4ade80;
    --red-bg: rgba(239,68,68,.1);
    --red-text: #f87171;
    --yellow-bg: rgba(234,179,8,.1);
    --yellow-text: #facc15;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter',
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

    background: var(--bg-color);
    color: var(--text-main);

    padding: 24px 16px;
    line-height: 1.5;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

header {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid var(--card-border);
    padding-bottom: 16px;

    flex-wrap: wrap;
    gap: 12px;
}

header h1 {
    font-size: 1.5rem;
    color: var(--accent-primary);
}

.live-status {
    font-size: .85rem;
    color: var(--green-text);

    display: flex;
    align-items: center;
    gap: 8px;

    background: var(--green-bg);
    padding: 6px 14px;

    border-radius: 20px;

    border: 1px solid rgba(52,211,153,.2);
}

.pulse-dot {
    width: 8px;
    height: 8px;

    background: var(--green-text);

    border-radius: 50%;

    display: inline-block;

    box-shadow: 0 0 8px var(--green-text);
}

.grid-summary {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 16px;

    margin-bottom: 24px;
}

.card {
    background: var(--card-bg);

    border: 1px solid var(--card-border);

    border-radius: 12px;

    padding: 20px;
}

.card-title {
    font-size: .8rem;

    font-weight: 600;

    color: var(--text-muted);

    text-transform: uppercase;

    margin-bottom: 6px;
}

.card-value {
    font-size: 1.6rem;
    font-weight: 700;
}

.section-card {
    background: var(--card-bg);

    border: 1px solid var(--card-border);

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 24px;
}

.section-title {
    font-size: 1.1rem;
    font-weight: 600;
}

.form-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr 1fr 140px;

    gap: 12px;

    margin-top: 16px;
}

@media (max-width: 768px) {

    .form-grid {
        grid-template-columns: 1fr;
    }
}

input {
    background: var(--bg-color);

    border: 1px solid var(--card-border);

    color: var(--text-main);

    padding: 10px 14px;

    border-radius: 8px;

    font-size: .9rem;

    outline: none;

    width: 100%;
}

input:focus {
    border-color: var(--accent-primary);
}

.btn-primary {
    background: var(--accent-primary);

    color: #0b0f19;

    font-weight: 700;

    border: none;

    padding: 12px 20px;

    border-radius: 8px;

    cursor: pointer;
}

.btn-primary:hover {
    background: var(--accent-hover);
    color: white;
}

.portfolio-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    flex-wrap: wrap;

    gap: 15px;

    margin-bottom: 16px;
}

.controls {
    display: flex;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;
}

.btn-refresh {
    background: var(--accent-primary);

    color: #0b0f19;

    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    font-weight: 700;

    cursor: pointer;
}

.btn-refresh:hover {
    background: var(--accent-hover);
    color: white;
}

.btn-refresh:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.auto-box {
    display: flex;

    align-items: center;

    gap: 7px;

    background: var(--bg-color);

    border: 1px solid var(--card-border);

    padding: 9px 12px;

    border-radius: 8px;

    font-size: .82rem;

    color: var(--text-muted);
}

.auto-box input {
    width: auto;
}

.last-update {
    font-size: .78rem;
    color: var(--text-muted);
}

.market-info {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 12px;
}

.info-badge {
    background: var(--bg-color);

    border: 1px solid var(--card-border);

    color: var(--text-muted);

    padding: 6px 10px;

    border-radius: 7px;

    font-size: .75rem;
}

.info-badge strong {
    color: var(--text-main);
}

.status-message {
    min-height: 24px;

    margin-bottom: 10px;

    font-size: .82rem;
}

.success {
    color: var(--green-text);
}

.warning {
    color: var(--yellow-text);
}

.error {
    color: var(--red-text);
}

.table-container {
    overflow-x: auto;

    border: 1px solid var(--card-border);

    border-radius: 12px;

    background: var(--card-bg);
}

table {
    width: 100%;

    border-collapse: collapse;

    text-align: left;

    font-size: .9rem;
}

th {
    background: #111827;

    color: var(--text-muted);

    padding: 14px 16px;

    border-bottom: 1px solid var(--card-border);

    font-size: .75rem;

    text-transform: uppercase;

    white-space: nowrap;
}

td {
    padding: 14px 16px;

    border-bottom: 1px solid var(--card-border);

    white-space: nowrap;
}

.price-input {
    width: 110px;

    padding: 6px 10px;

    border-radius: 6px;

    font-size: .9rem;

    text-align: right;

    border: 1px solid var(--card-border);

    background: var(--bg-color);

    color: var(--accent-primary);

    font-weight: 600;
}

.badge {
    display: inline-block;

    padding: 4px 8px;

    border-radius: 6px;

    font-weight: 600;

    font-size: .85rem;
}

.badge-positive {
    background: var(--green-bg);
    color: var(--green-text);
}

.badge-negative {
    background: var(--red-bg);
    color: var(--red-text);
}

.positive {
    color: var(--green-text);
}

.negative {
    color: var(--red-text);
}

.btn-delete {
    background: transparent;

    border: 1px solid var(--card-border);

    color: var(--red-text);

    padding: 5px 9px;

    border-radius: 6px;

    cursor: pointer;
}

.btn-delete:hover {
    background: var(--red-bg);
}

</style>
</head>

<body>

<div class="container">

<header>

    <h1>
        Portföyüm v39 🚀
    </h1>

    <div class="live-status">

        <span class="pulse-dot"></span>

        <span id="statusText">
            Sistem Hazır
        </span>

    </div>

</header>


<!-- ======================================================
     ÖZET
====================================================== -->

<div class="grid-summary">

    <div class="card">

        <div class="card-title">
            Portföy Değeri
        </div>

        <div
            class="card-value"
            id="totalValue"
        >
            ₺0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Toplam Maliyet
        </div>

        <div
            class="card-value"
            id="totalCost"
        >
            ₺0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Toplam Kar / Zarar
        </div>

        <div
            class="card-value"
            id="totalProfit"
        >
            ₺0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Kar Oranı
        </div>

        <div
            class="card-value"
            id="totalProfitRatio"
        >
            %0.00
        </div>

    </div>

</div>


<!-- ======================================================
     YENİ HİSSE
====================================================== -->

<div class="section-card">

    <div class="section-title">
        Yeni Hisse Ekle
    </div>

    <div class="form-grid">

        <input
            type="text"
            id="symbol"
            placeholder="Hisse (Örn: SASA)"
            style="text-transform:uppercase"
        >

        <input
            type="text"
            id="amount"
            placeholder="Adet (Örn: 1000)"
        >

        <input
            type="text"
            id="avgCost"
            placeholder="Ort. Maliyet (₺)"
        >

        <button
            class="btn-primary"
            onclick="addAsset()"
        >
            Hisse Ekle
        </button>

    </div>

</div>


<!-- ======================================================
     PORTFÖY
====================================================== -->

<div class="section-card">

    <div class="portfolio-header">

        <div class="section-title">
            Hisse Portföyü
        </div>


        <div class="controls">

            <label class="auto-box">

                <input
                    type="checkbox"
                    id="autoUpdate"
                    checked
                    onchange="toggleAutoUpdate()"
                >

                30 saniyede otomatik güncelle

            </label>


            <span
                class="last-update"
                id="lastUpdate"
            >
                Son güncelleme: -
            </span>


            <button
                class="btn-refresh"
                id="refreshButton"
                onclick="fetchAllLivePrices()"
            >
                🔄 Piyasadan Güncelle
            </button>

        </div>

    </div>


    <div class="market-info">

        <div class="info-badge">

            Portföy:
            <strong id="portfolioCount">
                0
            </strong>

        </div>


        <div class="info-badge">

            BIST verisi:
            <strong id="marketCount">
                -
            </strong>

        </div>


        <div class="info-badge">

            Güncellenen:
            <strong id="successCount">
                -
            </strong>

        </div>


        <div class="info-badge">

            Bulunamayan:
            <strong id="failedCount">
                -
            </strong>

        </div>

    </div>


    <div
        id="updateMessage"
        class="status-message"
    ></div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Hisse</th>

                    <th>Adet</th>

                    <th>Ort. Maliyet</th>

                    <th>Güncel Fiyat</th>

                    <th>Toplam Değer</th>

                    <th>Kar / Zarar</th>

                    <th>Oran</th>

                    <th>İşlem</th>

                </tr>

            </thead>


            <tbody id="assetList"></tbody>

        </table>

    </div>

</div>

</div>


<script>


/* ============================================================
   AYARLAR
============================================================ */


/*
 * Eski portföyünü kaybetmemek için
 * aynı localStorage anahtarını kullanıyoruz.
 */

const STORAGE_KEY =
    "bist_assets_v36";


/*
 * HER 30 SANİYE
 */

const AUTO_UPDATE_MS =
    30000;


/*
 * TOPLU BIST VERİ KAYNAĞI
 *
 * Kaynak:
 * api.asenax.com/bist/all/
 *
 * Açıklamasına göre:
 * - Tüm hisseler
 * - Midas kaynaklı
 * - 15 dakika gecikmeli
 */

const BIST_ALL_URL =
    "https://api.asenax.com/bist/all/";


let assets =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        )
    ) || [];


let marketPrices = {};

let isUpdating = false;

let autoTimer = null;


/* ============================================================
   SAYI
============================================================ */

function parseNum(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }


    let text =
        value
        .toString()
        .trim();


    /*
     * Türkçe sayı formatı
     *
     * 1.234,56
     */

    if (
        text.includes(",")
    ) {

        text =
            text
            .replace(/\./g, "")
            .replace(",", ".");

    } else {

        /*
         * Normal ondalık:
         *
         * 34.52
         */

        text =
            text.replace(
                /[^\d.-]/g,
                ""
            );
    }


    const n =
        parseFloat(text);


    return isNaN(n)
        ? 0
        : n;
}


/* ============================================================
   KAYDET
============================================================ */

function saveAssets() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(assets)
    );
}


/* ============================================================
   MESAJ
============================================================ */

function message(
    text,
    type = ""
) {

    const el =
        document.getElementById(
            "updateMessage"
        );


    el.innerText =
        text;


    el.className =
        "status-message";


    if (type) {

        el.classList.add(
            type
        );
    }
}


/* ============================================================
   SEMBOL TEMİZLE
============================================================ */

function cleanSymbol(symbol) {

    return String(
        symbol || ""
    )
    .toUpperCase()
    .trim()
    .replace(
        ".IS",
        ""
    );
}


/* ============================================================
   TOPLU VERİYİ NORMALLEŞTİR
============================================================ */


/*
 * API'nin döndürdüğü yapı farklı olabilir.
 *
 * Bu nedenle burada birkaç olası
 * JSON formatını destekliyoruz.
 */

function normalizeMarketData(data) {

    const prices = {};


    /*
     * --------------------------------------------------------
     * 1) ARRAY
     * --------------------------------------------------------
     */

    let rows = null;


    if (
        Array.isArray(data)
    ) {

        rows =
            data;

    }


    /*
     * --------------------------------------------------------
     * 2) data array
     * --------------------------------------------------------
     */

    else if (
        data &&
        Array.isArray(
            data.data
        )
    ) {

        rows =
            data.data;

    }


    /*
     * --------------------------------------------------------
     * 3) stocks
     * --------------------------------------------------------
     */

    else if (
        data &&
        Array.isArray(
            data.stocks
        )
    ) {

        rows =
            data.stocks;

    }


    /*
     * --------------------------------------------------------
     * 4) result
     * --------------------------------------------------------
     */

    else if (
        data &&
        Array.isArray(
            data.result
        )
    ) {

        rows =
            data.result;

    }


    /*
     * --------------------------------------------------------
     * 5) results
     * --------------------------------------------------------
     */

    else if (
        data &&
        Array.isArray(
            data.results
        )
    ) {

        rows =
            data.results;

    }


    /*
     * --------------------------------------------------------
     * 6) quotes
     * --------------------------------------------------------
     */

    else if (
        data &&
        Array.isArray(
            data.quotes
        )
    ) {

        rows =
            data.quotes;

    }


    /*
     * --------------------------------------------------------
     * ARRAY DEĞİLSE OBJECT OLABİLİR
     *
     * Örnek:
     *
     * {
     *   SASA: 34.50,
     *   ASELS: 215.30
     * }
     * --------------------------------------------------------
     */

    if (
        !rows &&
        data &&
        typeof data === "object"
    ) {

        const keys =
            Object.keys(
                data
            );


        /*
         * Eğer doğrudan:
         *
         * SASA: ...
         *
         * şeklindeyse
         */

        let directCount = 0;


        keys.forEach(
            key => {

                const value =
                    data[key];


                if (
                    typeof value === "number"
                ) {

                    const symbol =
                        cleanSymbol(
                            key
                        );


                    if (
                        symbol
                    ) {

                        prices[
                            symbol
                        ] =
                            value;

                        directCount++;
                    }
                }


                /*
                 * value object ise
                 */

                else if (
                    value &&
                    typeof value === "object"
                ) {

                    const symbol =
                        cleanSymbol(
                            value.symbol ||
                            value.code ||
                            value.ticker ||
                            key
                        );


                    const price =
                        extractPrice(
                            value
                        );


                    if (
                        symbol &&
                        price > 0
                    ) {

                        prices[
                            symbol
                        ] =
                            price;

                        directCount++;
                    }
                }

            }
        );


        if (
            directCount > 0
        ) {

            return prices;
        }
    }


    /*
     * --------------------------------------------------------
     * SATIRLARI İŞLE
     * --------------------------------------------------------
     */

    if (
        rows
    ) {

        rows.forEach(
            row => {

                if (
                    !row
                ) {
                    return;
                }


                /*
                 * Sembol
                 */

                const symbol =
                    cleanSymbol(
                        row.symbol ||
                        row.code ||
                        row.ticker ||
                        row.hisse ||
                        row.hisseKodu ||
                        row.kod
                    );


                /*
                 * Fiyat
                 */

                const price =
                    extractPrice(
                        row
                    );


                if (
                    symbol &&
                    price > 0
                ) {

                    prices[
                        symbol
                    ] =
                        price;
                }

            }
        );
    }


    return prices;
}


/* ============================================================
   FİYAT BUL
============================================================ */

function extractPrice(row) {

    if (
        row === null ||
        row === undefined
    ) {

        return 0;
    }


    /*
     * Eğer doğrudan sayı
     */

    if (
        typeof row === "number"
    ) {

        return row;
    }


    /*
     * Muhtemel alanlar
     */

    const possible =
        [
            row.price,
            row.currentPrice,
            row.current_price,
            row.lastPrice,
            row.last_price,
            row.last,
            row.close,
            row.closingPrice,
            row.fiyat,
            row.son,
            row.sonFiyat,
            row.lastValue,
            row.value
        ];


    for (
        const value of possible
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {

            const n =
                parseNum(
                    value
                );


            if (
                n > 0
            ) {

                return n;
            }
        }
    }


    return 0;
}


/* ============================================================
   BIST'TEN BÜTÜN HİSSELERİ AL
============================================================ */

async function fetchAllMarketPrices() {

    const response =
        await fetch(
            BIST_ALL_URL +
            "?t=" +
            Date.now(),
            {
                method: "GET",

                cache: "no-store",

                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    const prices =
        normalizeMarketData(
            data
        );


    if (
        Object.keys(
            prices
        ).length === 0
    ) {

        console.log(
            "API ham cevap:",
            data
        );


        throw new Error(
            "API'den fiyat listesi okunamadı."
        );
    }


    return prices;
}


/* ============================================================
   ANA GÜNCELLEME
============================================================ */

async function fetchAllLivePrices() {

    if (
        isUpdating
    ) {

        return;
    }


    if (
        assets.length === 0
    ) {

        message(
            "Önce portföye hisse ekleyin.",
            "warning"
        );

        return;
    }


    isUpdating =
        true;


    const button =
        document.getElementById(
            "refreshButton"
        );


    const status =
        document.getElementById(
            "statusText"
        );


    button.disabled =
        true;


    button.innerText =
        "⏳ Toplu veri alınıyor...";


    status.innerText =
        "Piyasa verisi alınıyor...";


    message(
        "BIST'teki bütün hisselerin fiyatları alınıyor..."
    );


    try {

        /*
         * ==================================================
         * TEK İSTEK
         * ==================================================
         */

        const prices =
            await fetchAllMarketPrices();


        marketPrices =
            prices;


        const marketCount =
            Object.keys(
                prices
            ).length;


        document.getElementById(
            "marketCount"
        ).innerText =
            marketCount;


        /*
         * ==================================================
         * PORTFÖYÜ EŞLEŞTİR
         * ==================================================
         */

        let success =
            0;


        let failed =
            0;


        const missing =
            [];


        assets.forEach(
            asset => {

                const symbol =
                    cleanSymbol(
                        asset.symbol
                    );


                const price =
                    prices[
                        symbol
                    ];


                if (
                    price !== undefined &&
                    price > 0
                ) {

                    /*
                     * GERÇEK GÜNCELLEME
                     */

                    asset.currentPrice =
                        price;


                    success++;

                } else {

                    /*
                     * Bulunamazsa
                     * eski fiyat korunur.
                     */

                    failed++;

                    missing.push(
                        symbol
                    );
                }

            }
        );


        /*
         * Kaydet
         */

        saveAssets();


        /*
         * Ekranı yenile
         */

        render();


        /*
         * Sayaçlar
         */

        document.getElementById(
            "successCount"
        ).innerText =
            success;


        document.getElementById(
            "failedCount"
        ).innerText =
            failed;


        /*
         * Saat
         */

        const time =
            new Date()
            .toLocaleTimeString(
                "tr-TR"
            );


        document.getElementById(
            "lastUpdate"
        ).innerText =
            "Son güncelleme: " +
            time;


        /*
         * Sonuç
         */

        if (
            failed === 0
        ) {

            status.innerText =
                "✓ Tüm hisseler güncellendi";


            message(
                `✓ ${success} portföy hissesinin tamamı güncellendi. BIST veri listesinde ${marketCount} hisse bulundu.`,
                "success"
            );

        } else {

            status.innerText =
                `✓ ${success} güncellendi`;


            const preview =
                missing
                .slice(
                    0,
                    10
                )
                .join(", ");


            let text =
                `✓ ${success} güncellendi. ⚠ ${failed} bulunamadı.`;


            if (
                preview
            ) {

                text +=
                    ` Bulunamayan: ${preview}`;
            }


            message(
                text,
                "warning"
            );
        }


    } catch (
        error
    ) {

        console.error(
            "BIST toplu veri hatası:",
            error
        );


        status.innerText =
            "Veri alınamadı";


        message(
            "❌ BIST toplu fiyat verisi alınamadı. Mevcut fiyatlar korunuyor.",
            "error"
        );

    } finally {

        button.disabled =
            false;


        button.innerText =
            "🔄 Piyasadan Güncelle";


        isUpdating =
            false;


        setTimeout(
            () => {

                if (
                    !isUpdating
                ) {

                    status.innerText =
                        "Sistem Hazır";
                }

            },
            5000
        );
    }
}


/* ============================================================
   MANUEL FİYAT
============================================================ */

function updateInlinePrice(
    index,
    value
) {

    const price =
        parseNum(
            value
        );


    if (
        price >= 0
    ) {

        assets[
            index
        ].currentPrice =
            price;


        saveAssets();


        render();


        message(
            `${assets[index].symbol} manuel fiyatı güncellendi.`,
            "success"
        );
    }
}


/* ============================================================
   HİSSE EKLE
============================================================ */

function addAsset() {

    const symbolInput =
        document.getElementById(
            "symbol"
        );


    const amountInput =
        document.getElementById(
            "amount"
        );


    const costInput =
        document.getElementById(
            "avgCost"
        );


    const symbol =
        cleanSymbol(
            symbolInput.value
        );


    const amount =
        parseNum(
            amountInput.value
        );


    const avgCost =
        parseNum(
            costInput.value
        );


    if (
        !symbol ||
        amount <= 0 ||
        avgCost <= 0
    ) {

        alert(
            "Lütfen Hisse Kodu, Adet ve Ort. Maliyet alanlarını doldurun."
        );

        return;
    }


    /*
     * Aynı hisse var mı?
     */

    const existingIndex =
        assets.findIndex(
            asset =>
                cleanSymbol(
                    asset.symbol
                ) === symbol
        );


    if (
        existingIndex >= 0
    ) {

        const existing =
            assets[
                existingIndex
            ];


        const oldCost =
            Number(
                existing.amount
            ) *
            Number(
                existing.avgCost
            );


        const newCost =
            amount *
            avgCost;


        const totalAmount =
            Number(
                existing.amount
            ) +
            amount;


        existing.amount =
            totalAmount;


        existing.avgCost =
            (
                oldCost +
                newCost
            ) /
            totalAmount;


        /*
         * Toplu veride varsa
         * hemen güncel fiyatı yaz.
         */

        if (
            marketPrices[
                symbol
            ]
        ) {

            existing.currentPrice =
                marketPrices[
                    symbol
                ];
        }

    } else {

        assets.push({

            symbol:
                symbol,

            amount:
                amount,

            avgCost:
                avgCost,

            currentPrice:
                marketPrices[
                    symbol
                ] ||
                avgCost

        });
    }


    symbolInput.value =
        "";


    amountInput.value =
        "";


    costInput.value =
        "";


    saveAssets();


    render();


    message(
        `${symbol} portföye eklendi.`,
        "success"
    );
}


/* ============================================================
   SİL
============================================================ */

function deleteAsset(
    index
) {

    const symbol =
        assets[
            index
        ].symbol;


    if (
        confirm(
            `${symbol} hissesini silmek istediğinize emin misiniz?`
        )
    ) {

        assets.splice(
            index,
            1
        );


        saveAssets();


        render();


        message(
            `${symbol} silindi.`,
            "success"
        );
    }
}


/* ============================================================
   OTOMATİK GÜNCELLEME
============================================================ */

function startAutoUpdate() {

    stopAutoUpdate();


    autoTimer =
        setInterval(
            () => {

                /*
                 * 30 saniyede bir.
                 *
                 * Yine TEK toplu istek.
                 */

                if (
                    assets.length > 0 &&
                    !isUpdating
                ) {

                    fetchAllLivePrices();
                }

            },
            AUTO_UPDATE_MS
        );
}


function stopAutoUpdate() {

    if (
        autoTimer
    ) {

        clearInterval(
            autoTimer
        );

        autoTimer =
            null;
    }
}


function toggleAutoUpdate() {

    const checkbox =
        document.getElementById(
            "autoUpdate"
        );


    if (
        checkbox.checked
    ) {

        startAutoUpdate();


        message(
            "Otomatik güncelleme açıldı. Her 30 saniyede bir toplu fiyat kontrol edilecek.",
            "success"
        );

    } else {

        stopAutoUpdate();


        message(
            "Otomatik güncelleme kapatıldı.",
            "warning"
        );
    }
}


/* ============================================================
   TABLOYU ÇİZ
============================================================ */

function render() {

    const list =
        document.getElementById(
            "assetList"
        );


    list.innerHTML =
        "";


    let totalValue =
        0;


    let totalCost =
        0;


    document.getElementById(
        "portfolioCount"
    ).innerText =
        assets.length;


    if (
        assets.length === 0
    ) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="
                        text-align:center;
                        color:var(--text-muted);
                        padding:30px;
                    "
                >

                    Henüz hisse eklenmedi.

                </td>

            </tr>

        `;

    }


    assets.forEach(
        (asset, index) => {

            const amount =
                Number(
                    asset.amount
                ) || 0;


            const avgCost =
                Number(
                    asset.avgCost
                ) || 0;


            const currentPrice =
                Number(
                    asset.currentPrice
                ) || 0;


            const cost =
                amount *
                avgCost;


            const value =
                amount *
                currentPrice;


            const profit =
                value -
                cost;


            const ratio =
                cost > 0
                    ? (
                        profit /
                        cost
                    ) * 100
                    : 0;


            totalCost +=
                cost;


            totalValue +=
                value;


            const positive =
                profit >= 0;


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    <strong
                        style="
                            color:var(--accent-primary);
                        "
                    >
                        ${asset.symbol}
                    </strong>

                </td>


                <td>
                    ${amount.toLocaleString(
                        "tr-TR"
                    )}
                </td>


                <td>
                    ₺${avgCost.toLocaleString(
                        "tr-TR",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}
                </td>


                <td>

                    <input
                        class="price-input"
                        type="text"
                        value="${currentPrice}"
                        onchange="
                            updateInlinePrice(
                                ${index},
                                this.value
                            )
                        "
                    >

                </td>


                <td>
                    ₺${value.toLocaleString(
                        "tr-TR",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}
                </td>


                <td
                    class="
                        ${
                            positive
                            ? "positive"
                            : "negative"
                        }
                    "
                >
                    ₺${profit.toLocaleString(
                        "tr-TR",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}
                </td>


                <td>

                    <span
                        class="
                            badge
                            ${
                                positive
                                ? "badge-positive"
                                : "badge-negative"
                            }
                        "
                    >
                        %${ratio.toFixed(2)}
                    </span>

                </td>


                <td>

                    <button
                        class="btn-delete"
                        onclick="
                            deleteAsset(
                                ${index}
                            )
                        "
                    >
                        🗑️ Sil
                    </button>

                </td>

            `;


            list.appendChild(
                row
            );

        }
    );


    /*
     * TOPLAM
     */

    const totalProfit =
        totalValue -
        totalCost;


    const totalRatio =
        totalCost > 0
            ? (
                totalProfit /
                totalCost
            ) * 100
            : 0;


    document.getElementById(
        "totalValue"
    ).innerText =
        `₺${totalValue.toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )}`;


    document.getElementById(
        "totalCost"
    ).innerText =
        `₺${totalCost.toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )}`;


    const profitEl =
        document.getElementById(
            "totalProfit"
        );


    profitEl.innerText =
        `₺${totalProfit.toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )}`;


    profitEl.className =
        "card-value " +
        (
            totalProfit >= 0
            ? "positive"
            : "negative"
        );


    const ratioEl =
        document.getElementById(
            "totalProfitRatio"
        );


    ratioEl.innerText =
        `%${totalRatio.toFixed(2)}`;


    ratioEl.className =
        "card-value " +
        (
            totalRatio >= 0
            ? "positive"
            : "negative"
        );
}


/* ============================================================
   BAŞLANGIÇ
============================================================ */

render();


/*
 * Sayfa açıldığında portföy varsa
 * 1 saniye sonra toplu fiyat çek.
 */

if (
    assets.length > 0
) {

    setTimeout(
        () => {

            fetchAllLivePrices();

        },
        1000
    );
}


/*
 * 30 saniyelik otomatik sistem
 */

startAutoUpdate();

</script>

</body>
</html>
