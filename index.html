<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portföyüm v37</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;

            --green-bg: rgba(34, 197, 94, 0.1);
            --green-text: #4ade80;

            --red-bg: rgba(239, 68, 68, 0.1);
            --red-text: #f87171;

            --yellow-bg: rgba(234, 179, 8, 0.1);
            --yellow-text: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .live-status {
            font-size: 0.85rem;
            color: var(--green-text);
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--green-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-text);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--green-text);
        }

        .grid-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 140px;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent-primary);
        }

        button {
            font-family: inherit;
        }

        button.btn-primary {
            background-color: var(--accent-primary);
            color: #0b0f19;
            font-weight: 700;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-refresh-mega {
            background-color: var(--accent-primary);
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            transition: all 0.2s;
        }

        .btn-refresh-mega:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .btn-refresh-mega:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge-positive {
            background-color: var(--green-bg);
            color: var(--green-text);
        }

        .badge-negative {
            background-color: var(--red-bg);
            color: var(--red-text);
        }

        .positive {
            color: var(--green-text);
        }

        .negative {
            color: var(--red-text);
        }

        .btn-action {
            background-color: transparent;
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-main);
        }

        .btn-delete {
            color: var(--red-text);
        }

        .btn-delete:hover {
            background-color: var(--red-bg);
        }

        .price-input {
            width: 110px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: right;
            border: 1px solid var(--card-border);
            background-color: var(--bg-color);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .update-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .auto-update-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .auto-update-box input {
            width: auto;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .last-update {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .status-message {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            min-height: 20px;
        }

        .success-text {
            color: var(--green-text);
        }

        .warning-text {
            color: var(--yellow-text);
        }

        .error-text {
            color: var(--red-text);
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 900px) {
            .section-header-flex {
                align-items: flex-start;
                flex-direction: column;
            }

            .update-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- BAŞLIK -->
    <header>
        <h1>Portföyüm v37 🚀</h1>

        <div class="live-status">
            <span class="pulse-dot"></span>
            <span id="statusText">Sistem Hazır</span>
        </div>
    </header>


    <!-- ÖZET KARTLARI -->
    <div class="grid-summary">

        <div class="card">
            <div class="card-title">Portföy Değeri</div>
            <div class="card-value" id="totalValue">₺0.00</div>
        </div>

        <div class="card">
            <div class="card-title">Toplam Maliyet</div>
            <div class="card-value" id="totalCost">₺0.00</div>
        </div>

        <div class="card">
            <div class="card-title">Toplam Kar / Zarar</div>
            <div class="card-value" id="totalProfit">₺0.00</div>
        </div>

        <div class="card">
            <div class="card-title">Kar Oranı</div>
            <div class="card-value" id="totalProfitRatio">%0.00</div>
        </div>

    </div>


    <!-- YENİ HİSSE EKLE -->
    <div class="section-card">

        <div class="section-title" style="margin-bottom: 16px;">
            Yeni Hisse Ekle
        </div>

        <div class="form-grid">

            <input
                type="text"
                id="symbol"
                placeholder="Hisse (Örn: SASA)"
                style="text-transform:uppercase"
            >

            <input
                type="text"
                id="amount"
                placeholder="Adet (Örn: 1000)"
            >

            <input
                type="text"
                id="avgCost"
                placeholder="Ort. Maliyet (₺)"
            >

            <button
                type="button"
                class="btn-primary"
                onclick="addAsset()"
            >
                Hisse Ekle
            </button>

        </div>

    </div>


    <!-- PORTFÖY -->
    <div
        class="section-card"
        style="padding: 20px 0 0 0; overflow: hidden;"
    >

        <div
            class="section-header-flex"
            style="padding: 0 20px;"
        >

            <div class="section-title" style="margin: 0;">
                Hisse Portföyü
            </div>

            <div class="update-panel">

                <label class="auto-update-box">
                    <input
                        type="checkbox"
                        id="autoUpdate"
                        checked
                        onchange="toggleAutoUpdate()"
                    >
                    Otomatik Güncelle
                </label>

                <span
                    class="last-update"
                    id="lastUpdate"
                >
                    Son güncelleme: Henüz yapılmadı
                </span>

                <button
                    class="btn-refresh-mega"
                    id="refreshButton"
                    onclick="fetchAllLivePrices()"
                >
                    🔄 Piyasadan Canlı Güncelle
                </button>

            </div>

        </div>


        <!-- DURUM MESAJI -->
        <div
            id="updateMessage"
            class="status-message"
            style="padding: 0 20px 12px 20px;"
        ></div>


        <!-- TABLO -->
        <div
            class="table-container"
            style="border: none; border-radius: 0;"
        >

            <table>

                <thead>
                    <tr>
                        <th>Hisse</th>
                        <th>Adet</th>
                        <th>Ort. Maliyet</th>
                        <th>Güncel Fiyat (₺)</th>
                        <th>Toplam Değer</th>
                        <th>Kar / Zarar</th>
                        <th>Oran (%)</th>
                        <th>İşlem</th>
                    </tr>
                </thead>

                <tbody id="assetList">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    document.title = "Portföyüm v37";


    /*
     * ============================================================
     * PORTFÖY VERİLERİ
     * ============================================================
     *
     * v36 ile aynı localStorage anahtarını kullanıyoruz.
     * Böylece mevcut hisselerin kaybolmaması amaçlanıyor.
     */

    let assets =
        JSON.parse(localStorage.getItem('bist_assets_v36')) || [];


    /*
     * Otomatik güncelleme ayarları
     */

    const AUTO_UPDATE_INTERVAL = 30000; // 30 saniye

    let autoUpdateTimer = null;

    let isUpdating = false;


    /*
     * ============================================================
     * SAYI DÖNÜŞTÜRME
     * ============================================================
     */

    function parseNum(val) {

        if (val === null || val === undefined || val === '') {
            return 0;
        }

        let clean = val
            .toString()
            .trim()
            .replace(/\./g, '')
            .replace(',', '.');

        let num = parseFloat(clean);

        return isNaN(num) ? 0 : num;
    }


    /*
     * ============================================================
     * KAYDET + EKRANI YENİLE
     * ============================================================
     */

    function saveAndRender() {

        localStorage.setItem(
            'bist_assets_v36',
            JSON.stringify(assets)
        );

        render();
    }


    /*
     * ============================================================
     * MANUEL FİYAT DEĞİŞTİRME
     * ============================================================
     */

    function updateInlinePrice(index, newPriceVal) {

        let price = parseNum(newPriceVal);

        if (price >= 0) {

            assets[index].currentPrice = price;

            saveAndRender();

            setStatus(
                `${assets[index].symbol} fiyatı manuel olarak güncellendi.`,
                'success'
            );
        }
    }


    /*
     * ============================================================
     * YAHOO FINANCE'TAN BIST FİYATI AL
     * ============================================================
     *
     * Örnek:
     *
     * THYAO
     *
     * Yahoo tarafında:
     *
     * THYAO.IS
     *
     */

    async function fetchBistPriceFromApi(symbol) {

        try {

            let cleanSymbol = symbol
                .toUpperCase()
                .replace('.IS', '')
                .trim();

            const yahooUrl =
                `https://query1.finance.yahoo.com/v8/finance/chart/${cleanSymbol}.IS?interval=1d&range=1d`;

            const proxyUrl =
                `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`;


            const controller = new AbortController();

            const timeoutId = setTimeout(() => {
                controller.abort();
            }, 10000);


            const response = await fetch(
                proxyUrl,
                {
                    method: 'GET',
                    cache: 'no-store',
                    signal: controller.signal
                }
            );


            clearTimeout(timeoutId);


            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const data = await response.json();


            if (
                data &&
                data.chart &&
                data.chart.result &&
                data.chart.result[0]
            ) {

                const result = data.chart.result[0];

                const meta = result.meta || {};


                /*
                 * Öncelik:
                 *
                 * regularMarketPrice
                 *
                 * olmazsa chartPreviousClose
                 */

                let price = meta.regularMarketPrice;

                if (
                    !price ||
                    !isFinite(price) ||
                    price <= 0
                ) {
                    price = meta.chartPreviousClose;
                }


                if (
                    price &&
                    isFinite(price) &&
                    price > 0
                ) {

                    return parseFloat(price);
                }
            }

        } catch (error) {

            console.log(
                `${symbol} fiyat alınamadı:`,
                error.message
            );
        }


        return null;
    }


    /*
     * ============================================================
     * TÜM HİSSELERİ GÜNCELLE
     * ============================================================
     */

    async function fetchAllLivePrices() {

        if (isUpdating) {
            return;
        }


        if (assets.length === 0) {

            setStatus(
                'Önce listeye hisse eklemelisiniz.',
                'warning'
            );

            return;
        }


        isUpdating = true;


        const statusText =
            document.getElementById('statusText');

        const updateMessage =
            document.getElementById('updateMessage');

        const refreshButton =
            document.getElementById('refreshButton');


        statusText.innerText =
            "Fiyatlar güncelleniyor...";


        updateMessage.className =
            "status-message";


        updateMessage.innerText =
            "Piyasadan fiyatlar alınıyor...";


        refreshButton.disabled = true;

        refreshButton.innerHTML =
            '⏳ Güncelleniyor...';


        let successCount = 0;

        let failedCount = 0;

        let failedSymbols = [];


        /*
         * Hisseleri sırayla çekiyoruz.
         *
         * Böylece aynı anda çok fazla istek
         * gönderip proxy'yi zorlamıyoruz.
         */

        for (let i = 0; i < assets.length; i++) {

            const symbol = assets[i].symbol;


            updateMessage.innerText =
                `${symbol} fiyatı alınıyor... (${i + 1}/${assets.length})`;


            const livePrice =
                await fetchBistPriceFromApi(symbol);


            if (
                livePrice !== null &&
                livePrice > 0
            ) {

                assets[i].currentPrice =
                    livePrice;

                successCount++;

            } else {

                /*
                 * Fiyat alınamazsa mevcut fiyatı
                 * kesinlikle silmiyoruz.
                 */

                failedCount++;

                failedSymbols.push(symbol);
            }
        }


        /*
         * Değişiklikleri kaydet
         */

        localStorage.setItem(
            'bist_assets_v36',
            JSON.stringify(assets)
        );


        render();


        const now =
            new Date().toLocaleTimeString(
                'tr-TR'
            );


        document.getElementById('lastUpdate').innerText =
            `Son güncelleme: ${now}`;


        /*
         * Sonuç mesajı
         */

        if (failedCount === 0) {

            statusText.innerText =
                `Güncellendi (${successCount}/${assets.length})`;

            updateMessage.className =
                "status-message success-text";

            updateMessage.innerText =
                `✓ ${successCount} hissenin fiyatı başarıyla güncellendi.`;

        } else {

            statusText.innerText =
                `Kısmi güncelleme (${successCount}/${assets.length})`;

            updateMessage.className =
                "status-message warning-text";

            updateMessage.innerText =
                `✓ ${successCount} güncellendi. ⚠ ${failedCount} alınamadı: ${failedSymbols.join(', ')}`;
        }


        refreshButton.disabled = false;

        refreshButton.innerHTML =
            '🔄 Piyasadan Canlı Güncelle';


        isUpdating = false;


        setTimeout(() => {

            if (!isUpdating) {
                statusText.innerText =
                    "Sistem Hazır";
            }

        }, 5000);
    }


    /*
     * ============================================================
     * HİSSE EKLE
     * ============================================================
     */

    async function addAsset() {

        const symbolInput =
            document.getElementById('symbol');

        const amountInput =
            document.getElementById('amount');

        const avgCostInput =
            document.getElementById('avgCost');


        const symbol =
            symbolInput.value
                .trim()
                .toUpperCase();


        const newAmount =
            parseNum(amountInput.value);


        const newAvgCost =
            parseNum(avgCostInput.value);


        if (
            !symbol ||
            newAmount <= 0 ||
            newAvgCost <= 0
        ) {

            alert(
                'Lütfen Hisse Kodu, Adet ve Ort. Maliyet alanlarını eksiksiz doldurun.'
            );

            return;
        }


        const statusText =
            document.getElementById('statusText');


        statusText.innerText =
            `${symbol} ekleniyor...`;


        /*
         * Hisse eklenirken de fiyatı almaya çalışıyoruz.
         *
         * Başarısız olursa ortalama maliyeti
         * geçici güncel fiyat olarak kullanıyoruz.
         */

        let livePrice =
            await fetchBistPriceFromApi(symbol);


        if (
            !livePrice ||
            livePrice <= 0
        ) {

            livePrice =
                newAvgCost;
        }


        const existingIndex =
            assets.findIndex(
                a => a.symbol === symbol
            );


        /*
         * Hisse zaten varsa:
         *
         * miktarı topluyoruz
         *
         * ortalama maliyeti yeniden hesaplıyoruz
         */

        if (existingIndex > -1) {

            let existing =
                assets[existingIndex];


            let totalQty =
                Number(existing.amount) +
                Number(newAmount);


            let totalCostSum =
                (
                    Number(existing.amount) *
                    Number(existing.avgCost)
                ) +
                (
                    Number(newAmount) *
                    Number(newAvgCost)
                );


            existing.amount =
                totalQty;


            existing.avgCost =
                totalCostSum / totalQty;


            existing.currentPrice =
                livePrice;

        } else {

            assets.push({

                symbol: symbol,

                amount: newAmount,

                avgCost: newAvgCost,

                currentPrice: livePrice

            });
        }


        symbolInput.value = '';

        amountInput.value = '';

        avgCostInput.value = '';


        saveAndRender();


        statusText.innerText =
            "Sistem Hazır";


        /*
         * Hisse ekledikten sonra fiyatları
         * tekrar güncellemek istersen otomatik
         * sistem zaten devam edecek.
         */
    }


    /*
     * ============================================================
     * HİSSE SİL
     * ============================================================
     */

    function deleteAsset(index) {

        if (
            confirm(
                `${assets[index].symbol} hissesini silmek istediğinize emin misiniz?`
            )
        ) {

            assets.splice(index, 1);

            saveAndRender();


            setStatus(
                'Hisse portföyden silindi.',
                'success'
            );
        }
    }


    /*
     * ============================================================
     * DURUM MESAJI
     * ============================================================
     */

    function setStatus(message, type = '') {

        const updateMessage =
            document.getElementById('updateMessage');


        updateMessage.innerText =
            message;


        updateMessage.className =
            'status-message';


        if (type === 'success') {
            updateMessage.classList.add(
                'success-text'
            );
        }

        if (type === 'warning') {
            updateMessage.classList.add(
                'warning-text'
            );
        }

        if (type === 'error') {
            updateMessage.classList.add(
                'error-text'
            );
        }
    }


    /*
     * ============================================================
     * OTOMATİK GÜNCELLEMEYİ BAŞLAT
     * ============================================================
     */

    function startAutoUpdate() {

        stopAutoUpdate();


        autoUpdateTimer =
            setInterval(
                () => {

                    if (
                        !isUpdating &&
                        assets.length > 0
                    ) {

                        fetchAllLivePrices();
                    }

                },
                AUTO_UPDATE_INTERVAL
            );
    }


    /*
     * ============================================================
     * OTOMATİK GÜNCELLEMEYİ DURDUR
     * ============================================================
     */

    function stopAutoUpdate() {

        if (autoUpdateTimer !== null) {

            clearInterval(
                autoUpdateTimer
            );

            autoUpdateTimer = null;
        }
    }


    /*
     * ============================================================
     * OTOMATİK GÜNCELLEME AÇ/KAPAT
     * ============================================================
     */

    function toggleAutoUpdate() {

        const checkbox =
            document.getElementById('autoUpdate');


        if (checkbox.checked) {

            startAutoUpdate();


            setStatus(
                'Otomatik güncelleme aktif. Her 30 saniyede kontrol edilecek.',
                'success'
            );

        } else {

            stopAutoUpdate();


            setStatus(
                'Otomatik güncelleme kapatıldı.',
                'warning'
            );
        }
    }


    /*
     * ============================================================
     * PORTFÖYÜ EKRANA BAS
     * ============================================================
     */

    function render() {

        const list =
            document.getElementById('assetList');


        list.innerHTML = '';


        let totalVal = 0;

        let totalCst = 0;


        if (assets.length === 0) {

            list.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        style="
                            text-align: center;
                            color: var(--text-muted);
                            padding: 24px;
                        "
                    >
                        Henüz hisse eklenmedi.
                    </td>
                </tr>
            `;
        }


        assets.forEach(
            (item, index) => {


                /*
                 * Eski localStorage verilerinde
                 * eksik alan ihtimaline karşı
                 * güvenli hale getiriyoruz.
                 */

                item.amount =
                    Number(item.amount) || 0;


                item.avgCost =
                    Number(item.avgCost) || 0;


                item.currentPrice =
                    Number(item.currentPrice) || 0;


                const itemCost =
                    item.amount *
                    item.avgCost;


                const itemVal =
                    item.amount *
                    item.currentPrice;


                const profit =
                    itemVal -
                    itemCost;


                const ratio =
                    itemCost > 0
                        ? (profit / itemCost) * 100
                        : 0;


                totalVal += itemVal;

                totalCst += itemCost;


                const isPos =
                    profit >= 0;


                const row =
                    document.createElement('tr');


                row.innerHTML = `

                    <td>
                        <strong
                            style="
                                color: var(--accent-primary);
                            "
                        >
                            ${item.symbol}
                        </strong>
                    </td>


                    <td>
                        ${item.amount.toLocaleString('tr-TR')}
                    </td>


                    <td>
                        ₺${item.avgCost.toLocaleString(
                            'tr-TR',
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )}
                    </td>


                    <td>

                        <input
                            type="text"
                            class="price-input"
                            value="${item.currentPrice}"
                            onchange="
                                updateInlinePrice(
                                    ${index},
                                    this.value
                                )
                            "
                        >

                    </td>


                    <td>
                        ₺${itemVal.toLocaleString(
                            'tr-TR',
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )}
                    </td>


                    <td
                        class="${isPos ? 'positive' : 'negative'}"
                    >
                        ₺${profit.toLocaleString(
                            'tr-TR',
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )}
                    </td>


                    <td>

                        <span
                            class="
                                badge
                                ${isPos
                                    ? 'badge-positive'
                                    : 'badge-negative'
                                }
                            "
                        >
                            %${ratio.toFixed(2)}
                        </span>

                    </td>


                    <td>

                        <button
                            class="
                                btn-action
                                btn-delete
                            "
                            onclick="
                                deleteAsset(${index})
                            "
                        >
                            🗑️ Sil
                        </button>

                    </td>
                `;


                list.appendChild(row);
            }
        );


        /*
         * TOPLAM HESAPLAR
         */

        const totalProfit =
            totalVal -
            totalCst;


        const totalRatio =
            totalCst > 0
                ? (totalProfit / totalCst) * 100
                : 0;


        document.getElementById(
            'totalValue'
        ).innerText =
            `₺${totalVal.toLocaleString(
                'tr-TR',
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            )}`;


        document.getElementById(
            'totalCost'
        ).innerText =
            `₺${totalCst.toLocaleString(
                'tr-TR',
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            )}`;


        const profitEl =
            document.getElementById(
                'totalProfit'
            );


        profitEl.innerText =
            `₺${totalProfit.toLocaleString(
                'tr-TR',
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            )}`;


        profitEl.className =
            `card-value ${
                totalProfit >= 0
                    ? 'positive'
                    : 'negative'
            }`;


        const ratioEl =
            document.getElementById(
                'totalProfitRatio'
            );


        ratioEl.innerText =
            `%${totalRatio.toFixed(2)}`;


        ratioEl.className =
            `card-value ${
                totalRatio >= 0
                    ? 'positive'
                    : 'negative'
            }`;
    }


    /*
     * ============================================================
     * SAYFA AÇILDIĞINDA
     * ============================================================
     */

    render();


    /*
     * Otomatik güncelleme kutusu varsayılan
     * olarak açık.
     *
     * Sayfa açılır açılmaz timer başlıyor.
     */

    startAutoUpdate();


    /*
     * Sayfa açıldığında portföy boş değilse
     * ilk fiyat güncellemesini de yap.
     *
     * Böylece kullanıcı 30 saniye beklemek
     * zorunda kalmaz.
     */

    if (assets.length > 0) {

        setTimeout(
            () => {
                fetchAllLivePrices();
            },
            1000
        );
    }

</script>

</body>
</html>
