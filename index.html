<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borsa Portföy ve İşlem Paneli</title>
    <!-- Bootstrap CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hidden-engine { display: none; } /* Gizli veri motoru alanı */
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h3 fw-bold text-primary">📊 Akıllı Portföy Yönetimi</h1>
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleEngine()">⚙️ Gizli Veri Motorunu Göster/Gizle</button>
        </header>

        <!-- ========================================== -->
        <!-- 1. GİZLİ VERİ MOTORU (Excel Mantığı Arka Plan) -->
        <!-- ========================================== -->
        <div id="engineSection" class="card p-3 mb-4 hidden-engine bg-dark text-white">
            <h5 class="text-warning">🔒 Gizli Veri Motoru (Canlı Fiyat Tablosu)</h5>
            <p class="small text-muted">Bu kısım arkada Excel gibi çalışır ve ön yüzü besler.</p>
            <table class="table table-dark table-striped table-sm" id="gizliTablo">
                <thead>
                    <tr>
                        <th>Hisse Kodu</th>
                        <th>Canlı Fiyat (TL)</th>
                        <th>Son Güncelleme</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dinamik olarak doldurulacak -->
                </tbody>
            </table>
        </div>

        <!-- ========================================== -->
        <!-- 2. ÖN YÜZ / PROGRAM KISMI (İşlem Paneli)   -->
        <!-- ========================================== -->
        <div class="row">
            <!-- İşlem Ekleme Formu -->
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <h5 class="mb-3">İşlem / Portföy Ekle</h5>
                    <div class="mb-3">
                        <label class="form-label">Hisse Kodu</label>
                        <input type="text" id="hisseKodu" class="form-control" placeholder="Örn: SASA, EREGL">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adet</label>
                        <input type="number" id="hisseAdet" class="form-control" value="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Birim Maliyet (TL)</label>
                        <input type="number" id="hisseMaliyet" class="form-control" step="0.01" value="10.00">
                    </div>
                    <button class="btn btn-primary w-100" onclick="portfoyeEkle()">Portföye Kaydet</button>
                </div>
            </div>

            <!-- Portföy Özeti ve Listesi -->
            <div class="col-md-8">
                <div class="card p-4">
                    <h5 class="mb-3">Portföy Durumunuz</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="portfoyTablosu">
                            <thead class="table-light">
                                <tr>
                                    <th>Hisse</th>
                                    <th>Adet</th>
                                    <th>Maliyet</th>
                                    <th>Güncel Fiyat</th>
                                    <th>Toplam Değer</th>
                                    <th>Kâr / Zarar</th>
                                    <th>İşlem</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Kullanıcı verileri buraya gelecek -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gizli veri motorunun simüle edilmiş fiyat havuzu (Google Finance mantığı)
        // Gerçek projede burası canlı API'lerden beslenir.
        let veriMotoru = {
            "SASA": 42.50,
            "EREGL": 51.20,
            "THYAO": 298.00,
            "GARAN": 95.40
        };

        let portfoy = JSON.parse(localStorage.getItem('user_portfoy')) || [];

        function toggleEngine() {
            let engine = document.getElementById('engineSection');
            if (engine.style.display === "none" || engine.style.display === "") {
                engine.style.display = "block";
                gizliTabloyuGuncelle();
            } else {
                engine.style.display = "none";
            }
        }

        function gizliTabloyuGuncelle() {
            let tbody = document.querySelector("#gizliTablo tbody");
            tbody.innerHTML = "";
            for (let [hisse, fiyat] of Object.entries(veriMotoru)) {
                tbody.innerHTML += `<tr><td><b>${hisse}</b></td><td>${fiyat.toFixed(2)} TL</td><td>Az önce</td></tr>`;
            }
        }

        function portfoyeEkle() {
            let kod = document.getElementById('hisseKodu').value.toUpperCase().trim();
            let adet = parseFloat(document.getElementById('hisseAdet').value);
            let maliyet = parseFloat(document.getElementById('hisseMaliyet').value);

            if (!kod || isNaN(adet) || isNaN(maliyet)) {
                alert("Lütfen tüm alanları eksiksiz doldurun!");
                return;
            }

            // Eğer veri motorunda bu hisse yoksa varsayılan bir fiyat atayalım
            if (!veriMotoru[kod]) {
                veriMotoru[kod] = maliyet; // Varsayılan olarak maliyet fiyatı alalım
            }

            portfoy.push({ kod, adet, maliyet });
            localStorage.setItem('user_portfoy', JSON.stringify(portfoy));
            portfoyuCiz();
            gizliTabloyuGuncelle();
        }

        function portfoyuCiz() {
            let tbody = document.querySelector("#portfoyTablosu tbody");
            tbody.innerHTML = "";

            if (portfoy.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Henüz portföyünüze eklenmiş bir hisse yok.</td></tr>`;
                return;
            }

            portfoy.forEach((item, index) => {
                let guncelFiyat = veriMotoru[item.kod] || item.maliyet;
                let toplamDeger = item.adet * guncelFiyat;
                let toplamMaliyet = item.adet * item.maliyet;
                let karZarar = toplamDeger - toplamMaliyet;
                let renkClass = karZarar >= 0 ? "text-success" : "text-danger";

                tbody.innerHTML += `
                    <tr>
                        <td><b>${item.kod}</b></td>
                        <td>${item.adet}</td>
                        <td>${item.maliyet.toFixed(2)} TL</td>
                        <td>${guncelFiyat.toFixed(2)} TL</td>
                        <td>${toplamDeger.toFixed(2)} TL</td>
                        <td class="${renkClass} fw-bold">${karZarar.toFixed(2)} TL</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="sil(${index})">Sil</button></td>
                    </tr>
                `;
            });
        }

        function sil(index) {
            portfoy.splice(index, 1);
            localStorage.setItem('user_portfoy', JSON.stringify(portfoy));
            portfoyuCiz();
        }

        // Sayfa açıldığında portföyü yükle
        window.onload = function() {
            portfoyuCiz();
            gizliTabloyuGuncelle();
        };
    </script>
</body>
</html>
