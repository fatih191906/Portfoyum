<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portföyüm v31</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;
            --green-bg: rgba(34, 197, 94, 0.1);
            --green-text: #4ade80;
            --red-bg: rgba(239, 68, 68, 0.1);
            --red-text: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-primary); }

        .live-status {
            font-size: 0.85rem;
            color: var(--green-text);
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--green-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-text);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--green-text);
        }

        .grid-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-value { font-size: 1.6rem; font-weight: 700; }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title { font-size: 1.1rem; font-weight: 600; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 140px;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input:focus { border-color: var(--accent-primary); }

        button.btn-primary {
            background-color: var(--accent-primary);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button.btn-primary:hover { background-color: var(--accent-hover); color: #fff; }

        .btn-refresh {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh:hover { background-color: var(--accent-primary); color: #0b0f19; }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: #111827; color: var(--text-muted); padding: 14px 16px; border-bottom: 1px solid var(--card-border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--card-border); }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
        .badge-positive { background-color: var(--green-bg); color: var(--green-text); }
        .badge-negative { background-color: var(--red-bg); color: var(--red-text); }
        .positive { color: var(--green-text); }
        .negative { color: var(--red-text); }

        .btn-action {
            background-color: transparent;
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-main);
        }
        .btn-delete { color: var(--red-text); }
        .btn-delete:hover { background-color: var(--red-bg); }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .calc-result-box {
            margin-top: 16px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: 600;
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Portföyüm v31 🚀</h1>
        <div class="live-status">
            <span class="pulse-dot"></span> 
            <span id="statusText">Portföy Aktif</span>
        </div>
    </header>

    <!-- ÖZET KARTLARI -->
    <div class="grid-summary">
        <div class="card">
            <div class="card-title">Portföy Değeri</div>
            <div class="card-value" id="totalValue">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Maliyet</div>
            <div class="card-value" id="totalCost">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Kar / Zarar</div>
            <div class="card-value" id="totalProfit">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Kar Oranı</div>
            <div class="card-value" id="totalProfitRatio">%0.00</div>
        </div>
    </div>

    <!-- YENİ HİSSE EKLEME FORMU -->
    <div class="section-card">
        <div class="section-title">Yeni Hisse Ekle</div>
        <div class="form-grid">
            <input type="text" id="symbol" placeholder="Hisse (Örn: SASA)" style="text-transform:uppercase">
            <input type="text" id="amount" placeholder="Adet (Örn: 1000)">
            <input type="text" id="avgCost" placeholder="Ort. Maliyet (₺)">
            <button type="button" class="btn-primary" onclick="addAsset()">Hisse Ekle</button>
        </div>
    </div>

    <!-- PORTFÖY TABLOSU -->
    <div class="section-card" style="padding: 20px 0 0 0; overflow: hidden;">
        <div class="section-header-flex" style="padding: 0 20px;">
            <div class="section-title" style="margin: 0;">Hisse Portföyü</div>
            <button class="btn-refresh" onclick="fetchAllPrices()">🔄 Fiyatları Güncelle</button>
        </div>
        <div class="table-container" style="border: none; border-radius: 0;">
            <table>
                <thead>
                    <tr>
                        <th>Hisse</th>
                        <th>Adet</th>
                        <th>Ort. Maliyet</th>
                        <th>Güncel Fiyat (₺)</th>
                        <th>Toplam Değer</th>
                        <th>Kar / Zarar</th>
                        <th>Oran (%)</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="assetList">
                </tbody>
            </table>
        </div>
    </div>

    <!-- MALİYET HESAPLAYICI -->
    <div class="section-card">
        <div class="section-title">Ağırlıklı Ortalama Maliyet Hesaplayıcı</div>
        <div class="calc-grid">
            <input type="text" id="calcOldQty" placeholder="Mevcut Adet" oninput="calculateNewCost()">
            <input type="text" id="calcOldCost" placeholder="Mevcut Maliyet (₺)" oninput="calculateNewCost()">
            <input type="text" id="calcNewQty" placeholder="Yeni Alınan Adet" oninput="calculateNewCost()">
            <input type="text" id="calcNewPrice" placeholder="Yeni Alış Fiyatı (₺)" oninput="calculateNewCost()">
        </div>
        <div class="calc-result-box" id="calcResult">
            Yeni Ortalama Maliyet: ₺0.00
        </div>
    </div>
</div>

<script>
    document.title = "Portföyüm v31";

    let assets = JSON.parse(localStorage.getItem('bist_assets_v31')) || [];

    function saveAndRender() {
        localStorage.setItem('bist_assets_v31', JSON.stringify(assets));
        render();
    }

    function parseNum(val) {
        if (!val) return 0;
        let clean = val.toString().replace(/\./g, '').replace(',', '.');
        let num = parseFloat(clean);
        return isNaN(num) ? 0 : num;
    }

    // Arka planda güvenilir bir API üzerinden BIST anlık fiyatını çeken fonksiyon
    async function fetchBistPrice(symbol) {
        try {
            let cleanSymbol = symbol.toUpperCase().replace('.IS', '').trim();
            // BIST verilerini CORS engeline takılmadan güvenle sağlayan genel finans uç noktası
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanSymbol}.IS?interval=1d`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            
            const response = await fetch(proxyUrl);
            const data = await response.json();
            
            if (data && data.chart && data.chart.result && data.chart.result[0]) {
                const meta = data.chart.result[0].meta;
                const price = meta.regularMarketPrice || meta.chartPreviousClose;
                if (price) return parseFloat(price);
            }
        } catch (e) {
            console.log(`${symbol} fiyatı alınamadı.`);
        }
        return null;
    }

    async function fetchAllPrices() {
        if (assets.length === 0) return;

        const statusText = document.getElementById('statusText');
        statusText.innerText = "Fiyatlar güncelleniyor...";

        for (let i = 0; i < assets.length; i++) {
            let livePrice = await fetchBistPrice(assets[i].symbol);
            if (livePrice && livePrice > 0) {
                assets[i].currentPrice = livePrice;
            }
        }

        saveAndRender();
        statusText.innerText = `Güncellendi: ${new Date().toLocaleTimeString('tr-TR')}`;
        setTimeout(() => { statusText.innerText = "Portföy Aktif"; }, 3000);
    }

    async function addAsset() {
        const symbolInput = document.getElementById('symbol');
        const amountInput = document.getElementById('amount');
        const avgCostInput = document.getElementById('avgCost');

        const symbol = symbolInput.value.trim().toUpperCase();
        const newAmount = parseNum(amountInput.value);
        let newAvgCost = parseNum(avgCostInput.value);

        if (!symbol || newAmount <= 0 || newAvgCost <= 0) {
            alert('Lütfen Hisse Kodu, Adet ve Ort. Maliyet alanlarını eksiksiz doldurun.');
            return;
        }

        const statusText = document.getElementById('statusText');
        statusText.innerText = `${symbol} için güncel fiyat aranıyor...`;

        // Arka planda canlı fiyatı çekmeye çalış, çekemezse şimdilik maliyetini ata
        let livePrice = await fetchBistPrice(symbol);
        if (!livePrice || livePrice <= 0) {
            livePrice = newAvgCost;
        }

        statusText.innerText = "Portföy Aktif";

        const existingIndex = assets.findIndex(a => a.symbol === symbol);

        if (existingIndex > -1) {
            let existing = assets[existingIndex];
            let totalQty = existing.amount + newAmount;
            let totalCostSum = (existing.amount * existing.avgCost) + (newAmount * newAvgCost);
            
            existing.amount = totalQty;
            existing.avgCost = totalCostSum / totalQty;
            existing.currentPrice = livePrice;
        } else {
            assets.push({ 
                symbol: symbol, 
                amount: newAmount, 
                avgCost: newAvgCost, 
                currentPrice: livePrice 
            });
        }

        symbolInput.value = '';
        amountInput.value = '';
        avgCostInput.value = '';

        saveAndRender();
    }

    function deleteAsset(index) {
        if (confirm(`${assets[index].symbol} hissesini silmek istediğinize emin misiniz?`)) {
            assets.splice(index, 1);
            saveAndRender();
        }
    }

    function render() {
        const list = document.getElementById('assetList');
        list.innerHTML = '';

        let totalVal = 0;
        let totalCst = 0;

        if (assets.length === 0) {
            list.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 24px;">Henüz hisse eklenmedi.</td></tr>`;
        }

        assets.forEach((item, index) => {
            const itemCost = item.amount * item.avgCost;
            const itemVal = item.amount * item.currentPrice;
            const profit = itemVal - itemCost;
            const ratio = itemCost > 0 ? (profit / itemCost) * 100 : 0;

            totalVal += itemVal;
            totalCst += itemCost;

            const isPos = profit >= 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong style="color: var(--accent-primary);">${item.symbol}</strong></td>
                <td>${item.amount.toLocaleString('tr-TR')}</td>
                <td>₺${item.avgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${item.currentPrice.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${itemVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${isPos ? 'positive' : 'negative'}">₺${profit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td><span class="badge ${isPos ? 'badge-positive' : 'badge-negative'}">%${ratio.toFixed(2)}</span></td>
                <td>
                    <button class="btn-action btn-delete" onclick="deleteAsset(${index})">🗑️ Sil</button>
                </td>
            `;
            list.appendChild(row);
        });

        const totalProfit = totalVal - totalCst;
        const totalRatio = totalCst > 0 ? (totalProfit / totalCst) * 100 : 0;

        document.getElementById('totalValue').innerText = `₺${totalVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('totalCost').innerText = `₺${totalCst.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        const profitEl = document.getElementById('totalProfit');
        profitEl.innerText = `₺${totalProfit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        profitEl.className = `card-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

        const ratioEl = document.getElementById('totalProfitRatio');
        if (ratioEl) {
            ratioEl.innerText = `%${totalRatio.toFixed(2)}`;
            ratioEl.className = `card-value ${totalRatio >= 0 ? 'positive' : 'negative'}`;
        }
    }

    function calculateNewCost() {
        const oldQty = parseNum(document.getElementById('calcOldQty').value);
        const oldCost = parseNum(document.getElementById('calcOldCost').value);
        const newQty = parseNum(document.getElementById('calcNewQty').value);
        const newPrice = parseNum(document.getElementById('calcNewPrice').value);

        const totalQty = oldQty + newQty;
        if (totalQty === 0) {
            document.getElementById('calcResult').innerText = 'Yeni Ortalama Maliyet: ₺0.00';
            return;
        }

        const totalCostSum = (oldQty * oldCost) + (newQty * newPrice);
        const finalAvgCost = totalCostSum / totalQty;

        document.getElementById('calcResult').innerText = `Yeni Ortalama Maliyet: ₺${finalAvgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} (Toplam Adet: ${totalQty.toLocaleString('tr-TR')})`;
    }

    render();
</script>

</body>
</html>
