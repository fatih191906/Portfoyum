<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BİST Portföy Takip v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;
            --green-bg: rgba(34, 197, 94, 0.1);
            --green-text: #4ade80;
            --red-bg: rgba(239, 68, 68, 0.1);
            --red-text: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-primary); }

        .live-status {
            font-size: 0.85rem;
            color: var(--green-text);
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--green-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-text);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--green-text);
        }

        .grid-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-value { font-size: 1.6rem; font-weight: 700; }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) 120px;
            gap: 12px;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: var(--accent-primary); }

        button.btn-primary {
            background-color: var(--accent-primary);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button.btn-primary:hover { background-color: var(--accent-hover); color: #fff; }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: #111827; color: var(--text-muted); padding: 14px 16px; border-bottom: 1px solid var(--card-border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--card-border); }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
        .badge-positive { background-color: var(--green-bg); color: var(--green-text); }
        .badge-negative { background-color: var(--red-bg); color: var(--red-text); }
        .positive { color: var(--green-text); }
        .negative { color: var(--red-text); }

        .btn-action {
            background-color: transparent;
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-main);
            margin-right: 4px;
        }

        .btn-action:hover { background-color: var(--card-border); }
        .btn-delete { color: var(--red-text); }
        .btn-delete:hover { background-color: var(--red-bg); }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .calc-result-box {
            margin-top: 16px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: 600;
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BİST Portföy Takip v3</h1>
        <div class="live-status">
            <span class="pulse-dot"></span> Canlı Veri Servisi
        </div>
    </header>

    <!-- ÖZET KARTLARI -->
    <div class="grid-summary">
        <div class="card">
            <div class="card-title">Portföy Değeri</div>
            <div class="card-value" id="totalValue">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Maliyet</div>
            <div class="card-value" id="totalCost">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Kar / Zarar</div>
            <div class="card-value" id="totalProfit">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Kar Oranı</div>
            <div class="card-value" id="totalProfitRatio">%0.00</div>
        </div>
    </div>

    <!-- VARLIK EKLEME FORMU -->
    <div class="section-card">
        <div class="section-title">Yeni BİST Hissesi Ekle</div>
        <form id="assetForm" onsubmit="addAsset(event)">
            <div class="form-grid">
                <input type="text" id="symbol" placeholder="Hisse Kodu (Örn: SASA)" style="text-transform:uppercase" required>
                <input type="number" id="amount" placeholder="Adet" step="any" required>
                <input type="number" id="avgCost" placeholder="Ort. Maliyet (₺)" step="any">
                <input type="number" id="currentPriceInput" placeholder="Güncel Fiyat (₺)" step="any">
                <button type="submit" class="btn-primary">Ekle</button>
            </div>
        </form>
    </div>

    <!-- PORTFÖY TABLOSU -->
    <div class="section-card" style="padding: 0; overflow: hidden;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Hisse</th>
                        <th>Adet</th>
                        <th>Ort. Maliyet</th>
                        <th>Güncel Fiyat</th>
                        <th>Toplam Değer</th>
                        <th>Kar / Zarar</th>
                        <th>Oran (%)</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="assetList">
                </tbody>
            </table>
        </div>
    </div>

    <!-- MALİYET HESAPLAYICI -->
    <div class="section-card">
        <div class="section-title">Ağırlıklı Ortalama Maliyet Hesaplayıcı</div>
        <div class="calc-grid">
            <input type="number" id="calcOldQty" placeholder="Mevcut Adet" oninput="calculateNewCost()">
            <input type="number" id="calcOldCost" placeholder="Mevcut Maliyet (₺)" oninput="calculateNewCost()">
            <input type="number" id="calcNewQty" placeholder="Yeni Alınan Adet" oninput="calculateNewCost()">
            <input type="number" id="calcNewPrice" placeholder="Yeni Alış Fiyatı (₺)" oninput="calculateNewCost()">
        </div>
        <div class="calc-result-box" id="calcResult">
            Yeni Ortalama Maliyet: ₺0.00
        </div>
    </div>
</div>

<script>
    let assets = JSON.parse(localStorage.getItem('bist_assets')) || [];

    function saveAndRender() {
        localStorage.setItem('bist_assets', JSON.stringify(assets));
        render();
    }

    async function fetchPriceFromBist(symbol) {
        const cleanSymbol = symbol.trim().toUpperCase().replace('.IS', '');
        try {
            // Yahoo Finance API üzerinden fiyat çekme
            const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanSymbol}.IS`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            
            const res = await fetch(proxyUrl);
            if (!res.ok) return null;
            
            const data = await res.json();
            const parsed = JSON.parse(data.contents);
            const price = parsed.chart.result[0].meta.regularMarketPrice;
            return price || null;
        } catch (e) {
            return null;
        }
    }

    function addAsset(e) {
        e.preventDefault();

        const symbolInput = document.getElementById('symbol');
        const amountInput = document.getElementById('amount');
        const avgCostInput = document.getElementById('avgCost');
        const currentPriceInput = document.getElementById('currentPriceInput');

        const symbol = symbolInput.value.trim().toUpperCase().replace('.IS', '');
        const amount = parseFloat(amountInput.value) || 0;
        let avgCost = parseFloat(avgCostInput.value) || 0;
        let manualPrice = parseFloat(currentPriceInput.value) || 0;

        if (!symbol || amount <= 0) return;

        // Fiyat veya maliyet girilmediyse birbirine eşitle
        const initialPrice = manualPrice > 0 ? manualPrice : (avgCost > 0 ? avgCost : 1);
        if (avgCost === 0) avgCost = initialPrice;

        assets.push({ 
            symbol: symbol, 
            amount: amount, 
            avgCost: avgCost, 
            currentPrice: initialPrice 
        });

        // Formu Sıfırla
        document.getElementById('assetForm').reset();

        saveAndRender();
        fetchLivePrices();
    }

    async function fetchLivePrices() {
        if (assets.length === 0) return;
        
        let hasUpdate = false;
        for (let item of assets) {
            const livePrice = await fetchPriceFromBist(item.symbol);
            if (livePrice && livePrice !== item.currentPrice) {
                item.currentPrice = livePrice;
                hasUpdate = true;
            }
        }
        if (hasUpdate) {
            saveAndRender();
        }
    }

    function updatePriceManual(index) {
        const item = assets[index];
        const newPrice = prompt(`${item.symbol} için yeni güncel fiyatı girin:`, item.currentPrice);
        if (newPrice !== null && !isNaN(parseFloat(newPrice))) {
            item.currentPrice = parseFloat(newPrice);
            saveAndRender();
        }
    }

    function deleteAsset(index) {
        assets.splice(index, 1);
        saveAndRender();
    }

    function render() {
        const list = document.getElementById('assetList');
        list.innerHTML = '';

        let totalVal = 0;
        let totalCst = 0;

        if (assets.length === 0) {
            list.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 24px;">Henüz hisse eklenmedi.</td></tr>`;
        }

        assets.forEach((item, index) => {
            const itemCost = item.amount * item.avgCost;
            const itemVal = item.amount * item.currentPrice;
            const profit = itemVal - itemCost;
            const ratio = itemCost > 0 ? (profit / itemCost) * 100 : 0;

            totalVal += itemVal;
            totalCst += itemCost;

            const isPos = profit >= 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong style="color: var(--accent-primary);">${item.symbol}</strong></td>
                <td>${item.amount.toLocaleString('tr-TR')}</td>
                <td>₺${item.avgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${item.currentPrice.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${itemVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${isPos ? 'positive' : 'negative'}">₺${profit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td><span class="badge ${isPos ? 'badge-positive' : 'badge-negative'}">%${ratio.toFixed(2)}</span></td>
                <td>
                    <button class="btn-action" onclick="updatePriceManual(${index})">Fiyat Değiştir</button>
                    <button class="btn-action btn-delete" onclick="deleteAsset(${index})">Sil</button>
                </td>
            `;
            list.appendChild(row);
        });

        const totalProfit = totalVal - totalCst;
        const totalRatio = totalCst > 0 ? (totalProfit / totalCst) * 100 : 0;

        document.getElementById('totalValue').innerText = `₺${totalVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('totalCost').innerText = `₺${totalCst.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        const profitEl = document.getElementById('totalProfit');
        profitEl.innerText = `₺${totalProfit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        profitEl.className = `card-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

        const ratioEl = document.getElementById('totalProfitRatio');
        if (ratioEl) {
            ratioEl.innerText = `%${totalRatio.toFixed(2)}`;
            ratioEl.className = `card-value ${totalRatio >= 0 ? 'positive' : 'negative'}`;
        }
    }

    function calculateNewCost() {
        const oldQty = parseFloat(document.getElementById('calcOldQty').value) || 0;
        const oldCost = parseFloat(document.getElementById('calcOldCost').value) || 0;
        const newQty = parseFloat(document.getElementById('calcNewQty').value) || 0;
        const newPrice = parseFloat(document.getElementById('calcNewPrice').value) || 0;

        const totalQty = oldQty + newQty;
        if (totalQty === 0) {
            document.getElementById('calcResult').innerText = 'Yeni Ortalama Maliyet: ₺0.00';
            return;
        }

        const totalCostSum = (oldQty * oldCost) + (newQty * newPrice);
        const finalAvgCost = totalCostSum / totalQty;

        document.getElementById('calcResult').innerText = `Yeni Ortalama Maliyet: ₺${finalAvgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} (Toplam Adet: ${totalQty.toLocaleString('tr-TR')})`;
    }

    render();
    fetchLivePrices();
    setInterval(fetchLivePrices, 20000);
</script>

</body>
</html>
