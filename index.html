<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Borsa Portföyü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { cursor: pointer; transition: background 0.2s; }
        th:hover { background-color: #e2e6ea; }
        .badge-kurum { background-color: #dee2e6; color: #495057; }
        .detay-satir { background-color: #f1f3f5 !important; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="fw-bold text-primary mb-4">📈 Portföy Yönetim Paneli</h2>
    
    <div class="row">
        <!-- Giriş Formu -->
        <div class="col-md-4">
            <div class="card p-4">
                <h5>Yeni Alım Ekle</h5>
                <input type="text" id="hisseKodu" class="form-control mb-2" placeholder="Hisse (Örn: SASA)">
                <input type="text" id="hisseKurum" class="form-control mb-2" placeholder="Kurum (Örn: İnfo)">
                <input type="number" id="hisseAdet" class="form-control mb-2" placeholder="Adet">
                <input type="number" id="hisseMaliyet" class="form-control mb-3" placeholder="Maliyet">
                <button class="btn btn-primary w-100" onclick="portfoyeEkle()">Ekle</button>
            </div>
        </div>

        <!-- Portföy Listesi -->
        <div class="col-md-8">
            <div class="card p-4">
                <table class="table table-hover" id="portfoyTablosu">
                    <thead class="table-light">
                        <tr>
                            <th></th>
                            <th onclick="sirala('kurum')">Kurum ⇅</th>
                            <th onclick="sirala('kod')">Hisse ⇅</th>
                            <th onclick="sirala('toplamAdet')">Adet ⇅</th>
                            <th>Ort. Maliyet</th>
                            <th>Kâr/Zarar</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let portfoy = JSON.parse(localStorage.getItem('user_portfoy') || '[]');

    function portfoyeEkle() {
        let kod = document.getElementById('hisseKodu').value.toUpperCase().trim();
        let kurum = document.getElementById('hisseKurum').value.trim();
        let adet = parseFloat(document.getElementById('hisseAdet').value);
        let maliyet = parseFloat(document.getElementById('hisseMaliyet').value);

        if (!kod || !kurum || isNaN(adet)) return alert("Eksik bilgi!");

        let mevcut = portfoy.find(i => i.kod === kod);
        let yeniIslem = { adet, maliyet, kurum, tarih: new Date().toLocaleDateString() };

        if (mevcut) {
            mevcut.islemGecmisi.push(yeniIslem);
            hesapla(mevcut);
        } else {
            portfoy.push({ kod, islemGecmisi: [yeniIslem], toplamAdet: adet, ortMaliyet: maliyet });
        }
        kaydetVeCiz();
    }

    function hesapla(item) {
        let toplamTutar = 0;
        item.toplamAdet = 0;
        item.islemGecmisi.forEach(i => {
            toplamTutar += (i.adet * i.maliyet);
            item.toplamAdet += i.adet;
        });
        item.ortMaliyet = toplamTutar / item.toplamAdet;
    }

    // Sıralama Mantığı
    let yon = 1;
    function sirala(key) {
        yon *= -1;
        portfoy.sort((a, b) => {
            let valA = key === 'kurum' ? a.islemGecmisi[0].kurum : a[key];
            let valB = key === 'kurum' ? b.islemGecmisi[0].kurum : b[key];
            return (valA > valB ? 1 : -1) * yon;
        });
        portfoyuCiz();
    }

    function kaydetVeCiz() {
        localStorage.setItem('user_portfoy', JSON.stringify(portfoy));
        portfoyuCiz();
    }

    function portfoyuCiz() {
        let tbody = document.querySelector("tbody");
        tbody.innerHTML = "";
        portfoy.forEach((item, index) => {
            let kurumText = item.islemGecmisi.length > 1 ? "Çoklu Kurum" : item.islemGecmisi[0].kurum;
            tbody.innerHTML += `
                <tr>
                    <td><button class="btn btn-sm btn-light" onclick="detayAc(${index})">+</button></td>
                    <td><span class="badge badge-kurum">${kurumText}</span></td>
                    <td><b>${item.kod}</b></td>
                    <td>${item.toplamAdet}</td>
                    <td>${item.ortMaliyet.toFixed(2)}</td>
                    <td class="text-success">Hesaplanıyor</td>
                </tr>
                <tr id="detay-${index}" style="display:none" class="detay-satir">
                    <td colspan="6">
                        <table class="table table-sm">
                            ${item.islemGecmisi.map(i => `<tr><td>${i.tarih}</td><td>${i.kurum}</td><td>${i.adet} Adet</td><td>${i.maliyet} TL</td></tr>`).join('')}
                        </table>
                    </td>
                </tr>`;
        });
    }

    function detayAc(idx) {
        let d = document.getElementById('detay-' + idx);
        d.style.display = d.style.display === "none" ? "table-row" : "none";
    }

    window.onload = portfoyuCiz;
</script>
</body>
</html>
