<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portföy Takip & Maliyet Hesaplayıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #38bdf8;
            --accent-hover: #0284c7;
            --green-bg: rgba(34, 197, 94, 0.1);
            --green-text: #4ade80;
            --red-bg: rgba(239, 68, 68, 0.1);
            --red-text: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .grid-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: #3b82f6;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) 120px;
            gap: 12px;
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-primary);
        }

        button.btn-primary {
            background-color: var(--accent-primary);
            color: #0b0f19;
            font-weight: 600;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge-positive {
            background-color: var(--green-bg);
            color: var(--green-text);
        }

        .badge-negative {
            background-color: var(--red-bg);
            color: var(--red-text);
        }

        .positive { color: var(--green-text); }
        .negative { color: var(--red-text); }

        .btn-delete {
            background-color: transparent;
            color: var(--red-text);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--red-bg);
            border-color: var(--red-text);
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .calc-result-box {
            margin-top: 16px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-weight: 600;
            color: var(--accent-primary);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Portföy Takip Platformu</h1>
    </header>

    <!-- ÖZET KARTLARI -->
    <div class="grid-summary">
        <div class="card">
            <div class="card-title">Portföy Değeri</div>
            <div class="card-value" id="totalValue">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Maliyet</div>
            <div class="card-value" id="totalCost">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Toplam Kar / Zarar</div>
            <div class="card-value" id="totalProfit">₺0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Kar Oranı</div>
            <div class="card-value" id="totalProfitRatio">%0.00</div>
        </div>
    </div>

    <!-- VARLIK EKLEME FORMU -->
    <div class="section-card">
        <div class="section-title">Yeni Varlık Ekle</div>
        <div class="form-grid">
            <input type="text" id="symbol" placeholder="Hisse/Fon Kodu (Örn: SASA)" style="text-transform:uppercase">
            <input type="number" id="amount" placeholder="Adet" step="any">
            <input type="number" id="avgCost" placeholder="Maliyet (₺)" step="any">
            <input type="number" id="currentPrice" placeholder="Güncel Fiyat (₺)" step="any">
            <button class="btn-primary" onclick="addAsset()">Ekle</button>
        </div>
    </div>

    <!-- PORTFÖY TABLOSU -->
    <div class="section-card" style="padding: 0; overflow: hidden;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kod</th>
                        <th>Adet</th>
                        <th>Ort. Maliyet</th>
                        <th>Güncel Fiyat</th>
                        <th>Toplam Değer</th>
                        <th>Kar / Zarar</th>
                        <th>Oran (%)</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="assetList">
                    <!-- Veriler dinamik eklenecek -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MALİYET HESAPLAYICI -->
    <div class="section-card">
        <div class="section-title">Ağırlıklı Ortalama Maliyet Hesaplayıcı</div>
        <div class="calc-grid">
            <input type="number" id="calcOldQty" placeholder="Mevcut Adet" oninput="calculateNewCost()">
            <input type="number" id="calcOldCost" placeholder="Mevcut Maliyet (₺)" oninput="calculateNewCost()">
            <input type="number" id="calcNewQty" placeholder="Yeni Alınan Adet" oninput="calculateNewCost()">
            <input type="number" id="calcNewPrice" placeholder="Yeni Alış Fiyatı (₺)" oninput="calculateNewCost()">
        </div>
        <div class="calc-result-box" id="calcResult">
            Yeni Ortalama Maliyet: ₺0.00
        </div>
    </div>
</div>

<script>
    let assets = JSON.parse(localStorage.getItem('my_assets')) || [];

    function saveAndRender() {
        localStorage.setItem('my_assets', JSON.stringify(assets));
        render();
    }

    function addAsset() {
        const symbol = document.getElementById('symbol').value.trim().toUpperCase();
        const amount = parseFloat(document.getElementById('amount').value);
        const avgCost = parseFloat(document.getElementById('avgCost').value);
        const currentPrice = parseFloat(document.getElementById('currentPrice').value);

        if (!symbol || isNaN(amount) || isNaN(avgCost) || isNaN(currentPrice)) {
            alert('Lütfen tüm alanları geçerli değerlerle doldurun.');
            return;
        }

        assets.push({ symbol, amount, avgCost, currentPrice });
        
        document.getElementById('symbol').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('avgCost').value = '';
        document.getElementById('currentPrice').value = '';

        saveAndRender();
    }

    function deleteAsset(index) {
        assets.splice(index, 1);
        saveAndRender();
    }

    function render() {
        const list = document.getElementById('assetList');
        list.innerHTML = '';

        let totalVal = 0;
        let totalCst = 0;

        if (assets.length === 0) {
            list.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 24px;">Henüz eklenmiş bir varlık bulunmuyor.</td></tr>`;
        }

        assets.forEach((item, index) => {
            const itemCost = item.amount * item.avgCost;
            const itemVal = item.amount * item.currentPrice;
            const profit = itemVal - itemCost;
            const ratio = itemCost > 0 ? (profit / itemCost) * 100 : 0;

            totalVal += itemVal;
            totalCst += itemCost;

            const isPos = profit >= 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong style="color: var(--accent-primary);">${item.symbol}</strong></td>
                <td>${item.amount.toLocaleString('tr-TR')}</td>
                <td>₺${item.avgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${item.currentPrice.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td>₺${itemVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td class="${isPos ? 'positive' : 'negative'}">₺${profit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td><span class="badge ${isPos ? 'badge-positive' : 'badge-negative'}">%${ratio.toFixed(2)}</span></td>
                <td><button class="btn-delete" onclick="deleteAsset(${index})">Sil</button></td>
            `;
            list.appendChild(row);
        });

        const totalProfit = totalVal - totalCst;
        const totalRatio = totalCst > 0 ? (totalProfit / totalCst) * 100 : 0;

        document.getElementById('totalValue').innerText = `₺${totalVal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('totalCost').innerText = `₺${totalCst.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        const profitEl = document.getElementById('totalProfit');
        profitEl.innerText = `₺${totalProfit.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        profitEl.className = `card-value ${totalProfit >= 0 ? 'positive' : 'negative'}`;

        const ratioEl = document.getElementById('totalProfitRatio');
        ratioEl.innerText = `%${totalRatio.toFixed(2)}`;
        ratioEl.className = `card-value ${totalRatio >= 0 ? 'positive' : 'negative'}`;
    }

    function calculateNewCost() {
        const oldQty = parseFloat(document.getElementById('calcOldQty').value) || 0;
        const oldCost = parseFloat(document.getElementById('calcOldCost').value) || 0;
        const newQty = parseFloat(document.getElementById('calcNewQty').value) || 0;
        const newPrice = parseFloat(document.getElementById('calcNewPrice').value) || 0;

        const totalQty = oldQty + newQty;
        if (totalQty === 0) {
            document.getElementById('calcResult').innerText = 'Yeni Ortalama Maliyet: ₺0.00';
            return;
        }

        const totalCostSum = (oldQty * oldCost) + (newQty * newPrice);
        const finalAvgCost = totalCostSum / totalQty;

        document.getElementById('calcResult').innerText = `Yeni Ortalama Maliyet: ₺${finalAvgCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} (Toplam Adet: ${totalQty.toLocaleString('tr-TR')})`;
    }

    render();
</script>

</body>
</html>
